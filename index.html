<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP Hair Monster Hunt</title>

<script>
  (function () {
    try {
      var saved = localStorage.getItem('portal.theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['"Plus Jakarta Sans"', 'sans-serif'],
          mono: ['"Space Mono"', 'monospace'],
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">

<style>
  :root {
    --bg: oklch(0.98 0.012 300);
    --surface: oklch(0.955 0.018 300);
    --border: oklch(0.89 0.02 300);
    --ink: oklch(0.22 0.03 300);
    --muted: oklch(0.5 0.02 300);
    --accent: #7C4DFF;
    --accent-2: oklch(0.72 0.13 200);
    --card-shadow: 0 1px 2px oklch(0.2 0.02 300 / 0.06);
  }
  .dark {
    --bg: oklch(0.16 0.02 300);
    --surface: oklch(0.21 0.02 300);
    --border: oklch(0.32 0.03 300);
    --ink: oklch(0.95 0.02 300);
    --muted: oklch(0.65 0.02 300);
    --card-shadow: 0 1px 2px oklch(0 0 0 / 0.4);
  }

  /* Shared hair-monster animations (approach is driven frame-by-frame in
     JS via startApproach(); these two keyframes only play the short,
     fixed-duration outcome once the JS loop hands off — --ms carries the
     monster's exact scale at that moment so there's no visual jump). */
  .monster { position: absolute; width: 100px; height: 108px; transform-origin: center center; will-change: transform, opacity; }
  .monster svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 6px oklch(0.2 0.02 300 / 0.3)); }

  @keyframes monster-death {
    0% { transform: scale(var(--ms, 1)) rotate(0deg); opacity: 1; }
    45% { transform: scale(calc(var(--ms, 1) * 1.3)) rotate(-12deg); opacity: 1; }
    100% { transform: scale(0) rotate(28deg); opacity: 0; }
  }
  .monster-death { animation: monster-death 380ms ease-in forwards; }

  @keyframes monster-reached {
    0% { transform: scale(var(--ms, 1)); opacity: 1; }
    100% { transform: scale(calc(var(--ms, 1) * 1.35)); opacity: 0; }
  }
  .monster-reached { animation: monster-reached 300ms ease-in forwards; }

  @keyframes stage-shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
  }
  .stage-shake { animation: stage-shake 260ms ease-in-out; }
</style>
</head>
<body>

<div class="flex h-screen overflow-hidden bg-[var(--bg)] text-[var(--ink)] font-body">

  <aside class="w-[272px] shrink-0 bg-[var(--surface)] border-r border-[var(--border)] flex flex-col p-5 overflow-y-auto">
    <div class="flex items-start justify-between mb-1.5">
      <a href="#home" class="font-display font-bold text-lg leading-tight tracking-tight max-w-[172px] hover:opacity-80">Hair Monster Hunt</a>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="w-9 h-9 shrink-0 rounded-[10px] border border-[var(--border)] bg-white dark:bg-[var(--surface)] flex items-center justify-center hover:opacity-80">
        <svg class="dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <p class="text-[13px] text-[var(--muted)] leading-relaxed mb-7">Sharpen your reflexes and aim — hunt down the SP Hair Monster.</p>

    <div class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)] mb-2.5">Tools</div>
    <nav id="tool-nav" class="flex flex-col gap-1.5"></nav>
  </aside>

  <main id="content" class="flex-1 overflow-y-auto p-8 sm:p-14"></main>

</div>

<script>
  // ===== Tool registry =====
  const ToolRegistry = (() => {
    const tools = [];
    return {
      register(tool) { tools.push(tool); },
      get(id) { return tools.find(t => t.id === id); },
      all() { return tools.slice(); },
    };
  })();

  // ===== Storage helper (shared localStorage wrapper) =====
  const Storage = {
    load(toolId, fallback) {
      try {
        const raw = localStorage.getItem(`portal.${toolId}.stats`);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    },
    save(toolId, data) {
      try { localStorage.setItem(`portal.${toolId}.stats`, JSON.stringify(data)); } catch (e) {}
    },
    reset(toolId) {
      try { localStorage.removeItem(`portal.${toolId}.stats`); } catch (e) {}
    },
  };

  // ===== Difficulty (shared across tools; scales each tool's own base
  // approach time) =====
  const DIFFICULTY_MULTIPLIERS = { easy: 1.5, normal: 1, hard: 0.75 };
  const DIFFICULTY_LABELS = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
  function getDifficulty() {
    try { return localStorage.getItem('portal.difficulty') || 'normal'; } catch (e) { return 'normal'; }
  }
  function setDifficulty(d) {
    try { localStorage.setItem('portal.difficulty', d); } catch (e) {}
  }
  function renderDifficultyPicker(container, accentVar, onChange) {
    container.innerHTML = Object.keys(DIFFICULTY_MULTIPLIERS).map(d => {
      const active = d === getDifficulty();
      return `<button type="button" data-difficulty="${d}" class="px-2.5 py-1 rounded-lg text-xs font-semibold border" style="background:${active ? `var(${accentVar})` : 'transparent'}; color:${active ? '#fff' : 'var(--muted)'}; border-color:var(--border);">${DIFFICULTY_LABELS[d]}</button>`;
    }).join('');
    container.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        setDifficulty(btn.dataset.difficulty);
        renderDifficultyPicker(container, accentVar, onChange);
        if (onChange) onChange();
      });
    });
  }

  // ===== Shared word list (used by both click and type challenges) =====
  const HAIR_MONSTER_WORDS = ['FANG', 'CLAW', 'FUR', 'HAIR', 'SNARL', 'YETI', 'BITE', 'MANE', 'COMB', 'SHED', 'GROWL', 'SHAG'];
  function randomWord() {
    return HAIR_MONSTER_WORDS[Math.floor(Math.random() * HAIR_MONSTER_WORDS.length)];
  }
  function formatMs(ms) {
    return `${Math.round(ms)}ms`;
  }

  // ===== Shared hair-monster visual (used by both tools) =====
  const MONSTER_FUR_COLORS = ['#8B6B4A', '#5B4636', '#A9754F', '#6B5B73'];
  const HEART_ICON = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.6 7.9 3 4 7 4c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 4 0 6.4 3.9 5 7.7C19.5 16.4 12 21 12 21z"/></svg>`;

  function buildMonsterSVG(furColor) {
    // A toupee/wig creature: a hairpiece "body" with stubby legs peeking
    // out beneath it and googly eyes peeking out from under the hair.
    const cx = 50, cy = 52;

    const legs = `
      <rect x="${cx - 20}" y="72" width="8" height="20" rx="3" fill="${furColor}"/>
      <rect x="${cx + 12}" y="72" width="8" height="20" rx="3" fill="${furColor}"/>
      <ellipse cx="${cx - 16}" cy="93" rx="8" ry="5" fill="#241a12" opacity="0.8"/>
      <ellipse cx="${cx + 16}" cy="93" rx="8" ry="5" fill="#241a12" opacity="0.8"/>
    `;

    let tufts = '';
    const tuftCount = 8;
    for (let i = 0; i < tuftCount; i++) {
      const t = i / (tuftCount - 1);
      const tx = cx - 36 + t * 72 + (Math.random() * 4 - 2);
      const ty = cy + 14 + Math.sin(t * Math.PI) * 5 + (Math.random() * 3 - 1.5);
      const tr = 8 + Math.random() * 4;
      tufts += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${tr.toFixed(1)}" fill="${furColor}"/>`;
    }
    const wigPath = `M ${cx - 40} ${cy + 8} Q ${cx - 42} ${cy - 30} ${cx} ${cy - 32} Q ${cx + 42} ${cy - 30} ${cx + 40} ${cy + 8} Q ${cx + 20} ${cy + 22} ${cx} ${cy + 18} Q ${cx - 20} ${cy + 22} ${cx - 40} ${cy + 8} Z`;

    const strands = [-18, 0, 18].map((dx) => {
      const sx = cx + dx, sy = cy - 26;
      const bend = 10 + (Math.random() * 8 - 4);
      return `<path d="M ${sx - 12} ${sy} Q ${sx} ${sy - bend} ${sx + 12} ${sy + 3}" stroke="${furColor}" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.9"/>`;
    }).join('');

    const pupilJitterL = (Math.random() * 3 - 1.5).toFixed(1);
    const pupilJitterR = (Math.random() * 3 - 1.5).toFixed(1);

    return `<svg viewBox="0 0 100 108" xmlns="http://www.w3.org/2000/svg">
      ${legs}
      ${tufts}
      <path d="${wigPath}" fill="${furColor}"/>
      ${strands}
      <ellipse cx="${cx - 13}" cy="${cy + 2}" rx="9" ry="10" fill="#fff"/>
      <ellipse cx="${cx + 13}" cy="${cy + 2}" rx="9" ry="10" fill="#fff"/>
      <circle cx="${cx - 13 + Number(pupilJitterL)}" cy="${cy + 4}" r="4.3" fill="#241a12"/>
      <circle cx="${cx + 13 + Number(pupilJitterR)}" cy="${cy + 4}" r="4.3" fill="#241a12"/>
      <path d="M ${cx - 8} ${cy + 18} q 8 6 16 0" stroke="#241a12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  function createMonsterEl() {
    const wrap = document.createElement('div');
    wrap.className = 'monster';
    const fur = MONSTER_FUR_COLORS[Math.floor(Math.random() * MONSTER_FUR_COLORS.length)];
    wrap.innerHTML = buildMonsterSVG(fur);
    return wrap;
  }

  // Grows a monster element from far-away (small, faint) to right-in-your-
  // face (large, opaque) over durationMs, driven frame-by-frame so the
  // current scale is always known (needed for a seamless outcome handoff)
  // and so it can be cancelled cleanly if defeated early or unmounted.
  function startApproach(el, durationMs, onReached) {
    const startTime = performance.now();
    const fromScale = 0.25, toScale = 1.15;
    let rafId = null;
    let currentScale = fromScale;
    let done = false;
    function tick(now) {
      const t = Math.min((now - startTime) / durationMs, 1);
      currentScale = fromScale + t * (toScale - fromScale);
      el.style.transform = `scale(${currentScale})`;
      el.style.opacity = String(Math.min(0.4 + t * 0.6, 1));
      if (t < 1) {
        rafId = requestAnimationFrame(tick);
      } else if (!done) {
        done = true;
        onReached(currentScale);
      }
    }
    rafId = requestAnimationFrame(tick);
    return {
      scale: () => currentScale,
      cancel: () => { done = true; if (rafId !== null) cancelAnimationFrame(rafId); },
    };
  }

  function renderLives(el, lives, maxLives) {
    el.innerHTML = Array.from({ length: maxLives }, (_, i) => {
      const alive = i < lives;
      return `<span style="color:${alive ? 'oklch(0.6 0.19 20)' : 'var(--border)'}">${HEART_ICON}</span>`;
    }).join('');
  }

  // ===== Theme toggle =====
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('portal.theme', dark ? 'dark' : 'light'); } catch (e) {}
  });

  // ===== Sidebar nav =====
  function buildSidebarNav() {
    const nav = document.getElementById('tool-nav');
    nav.innerHTML = '';
    ToolRegistry.all().forEach(tool => {
      const a = document.createElement('a');
      a.href = `#${tool.id}`;
      a.dataset.toolId = tool.id;
      a.className = 'flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-semibold text-sm';
      a.innerHTML = `${tool.icon}<span>${tool.name}</span>`;
      nav.appendChild(a);
    });
  }

  function updateActiveNav(activeId) {
    document.querySelectorAll('#tool-nav a').forEach(a => {
      const tool = ToolRegistry.get(a.dataset.toolId);
      const isActive = a.dataset.toolId === activeId;
      a.style.background = isActive ? tool.color : 'transparent';
      a.style.color = isActive ? '#fff' : 'var(--ink)';
      if (isActive) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  // ===== Welcome / not-found panels =====
  function renderWelcome(container) {
    container.innerHTML = `
      <div class="max-w-[640px]">
        <h1 class="font-display font-bold text-4xl leading-tight tracking-tight mb-3.5">Hunt the SP Hair Monster</h1>
        <p class="text-base leading-relaxed text-[var(--muted)] mb-10">Pick a tool from the sidebar and take it on. New hunts join the collection over time — this is just the start.</p>
      </div>
      <div id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 max-w-[920px] mb-6"></div>
      <button id="reset-all" type="button" class="font-mono text-xs text-[var(--muted)] hover:opacity-80 underline">Reset all high scores</button>
    `;
    const grid = container.querySelector('#tool-grid');
    ToolRegistry.all().forEach(tool => grid.appendChild(renderToolCard(tool)));

    const ghost = document.createElement('div');
    ghost.className = 'border-[1.5px] border-dashed border-[var(--border)] rounded-[18px] p-[22px] flex flex-col items-start justify-center gap-2.5 text-[var(--muted)]';
    ghost.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <div class="text-[13px] font-semibold">More hunts coming soon</div>
    `;
    grid.appendChild(ghost);

    const resetAllBtn = container.querySelector('#reset-all');
    resetAllBtn.addEventListener('click', () => {
      if (!confirm('Reset high scores for every tool? This can\'t be undone.')) return;
      ToolRegistry.all().forEach(tool => Storage.reset(tool.id));
      const original = resetAllBtn.textContent;
      resetAllBtn.textContent = 'Cleared!';
      setTimeout(() => { resetAllBtn.textContent = original; }, 1200);
    });
  }

  function renderToolCard(tool) {
    const card = document.createElement('a');
    card.href = `#${tool.id}`;
    card.className = 'bg-white dark:bg-[var(--surface)] border border-[var(--border)] rounded-[18px] p-[22px] flex flex-col gap-3.5 shadow-[var(--card-shadow)] hover:opacity-90';
    card.innerHTML = `
      <div class="w-10 h-10 rounded-[11px] flex items-center justify-center text-white" style="background:${tool.color}">${tool.icon}</div>
      <div>
        <div class="font-bold text-base mb-1">${tool.name}</div>
        <div class="text-[13.5px] text-[var(--muted)] leading-snug">${tool.tagline}</div>
      </div>
      <div class="font-mono text-[12.5px] font-bold flex items-center gap-1 mt-auto" style="color:${tool.color}">Hunt &rarr;</div>
    `;
    return card;
  }

  function renderNotFound(container, id) {
    container.innerHTML = `
      <div class="max-w-[480px]">
        <h1 class="font-display font-bold text-2xl mb-3">No hunt called "${id}"</h1>
        <p class="text-[var(--muted)] mb-6">That tool doesn't exist (yet?). Head back and pick one from the list.</p>
        <a href="#home" class="font-mono text-sm font-bold" style="color:var(--accent)">&larr; Back home</a>
      </div>
    `;
  }

  // ===== Router =====
  const content = document.getElementById('content');
  let currentTool = null;

  function getRouteFromHash() {
    const id = location.hash.replace(/^#/, '').trim();
    return id || 'home';
  }

  function renderRoute() {
    const id = getRouteFromHash();
    if (currentTool && currentTool.unmount) currentTool.unmount();
    currentTool = null;
    content.innerHTML = '';

    if (id === 'home') {
      renderWelcome(content);
      updateActiveNav(null);
      document.title = 'SP Hair Monster Hunt';
      return;
    }
    const tool = ToolRegistry.get(id);
    if (!tool) {
      renderNotFound(content, id);
      updateActiveNav(null);
      document.title = 'SP Hair Monster Hunt';
      return;
    }
    tool.mount(content);
    currentTool = tool;
    updateActiveNav(id);
    document.title = `${tool.name} · SP Hair Monster Hunt`;
  }

  // ===== TOOL: Reflex Tester =====
  // A hunt of up to REFLEX_TOTAL monsters with LIVES lives. Each monster:
  // lurking (random 1.5-4s hidden wait, false starts here just retry) ->
  // approaching (monster grows over REFLEX_APPROACH_MS; click or type,
  // mode picked at random, to kill it before it reaches you) -> resolved
  // (killed = death animation + ms recorded; reached = lose a life). Hunt
  // ends at 20 kills (victory) or 0 lives (defeat).
  (() => {
    const ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>`;
    const REFLEX_TOTAL = 20;
    const REFLEX_LIVES = 3;
    const REFLEX_BASE_MS = 1400; // approach time at 'normal' difficulty

    let root, stageEl, messageEl, monsterEl;
    let session = 'idle'; // idle | hunting | ended
    let encounter = 'lurking'; // lurking | approaching
    let lives = REFLEX_LIVES;
    let kills = 0;
    let mode = null; // 'click' | 'type'
    let waitTimeoutId = null;
    let approachHandle = null;
    let cueShownAt = 0;
    let currentWord = '';
    let typedBuffer = '';
    let stats = { best: null, attempts: [] };

    function mount(container) {
      root = container;
      session = 'idle';
      lives = REFLEX_LIVES;
      kills = 0;
      waitTimeoutId = null;
      approachHandle = null;
      stats = Storage.load('reflex', { best: null, attempts: [] });

      root.innerHTML = `
        <div class="max-w-[560px]">
          <a href="#home" class="font-mono text-xs font-bold text-[var(--muted)] hover:opacity-80 inline-block mb-6">&larr; Back to hunts</a>
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-[11px] flex items-center justify-center text-white" style="background:var(--accent)">${ICON}</div>
            <h1 class="font-display font-bold text-2xl">Reflex Tester</h1>
          </div>
          <p class="text-sm text-[var(--muted)] mb-4">Wait for the Hair Monster, then click <em>or</em> type before it reaches you. 20 to defeat, ${REFLEX_LIVES} lives — jumping the gun early doesn't cost you one.</p>

          <div id="reflex-difficulty-row" class="flex items-center gap-2 mb-3">
            <span class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)]">Speed</span>
            <div id="reflex-difficulty"></div>
          </div>

          <div class="flex items-center gap-6 mb-3">
            <div id="reflex-lives" class="flex items-center gap-1"></div>
            <div id="reflex-progress" class="font-mono text-sm text-[var(--muted)]"></div>
          </div>

          <div id="reflex-stage" role="button" tabindex="0" aria-label="Reflex hunt stage" class="relative w-full h-64 rounded-[18px] border border-[var(--border)] flex items-center justify-center overflow-hidden cursor-pointer select-none" style="background:var(--surface)">
            <div id="reflex-message" class="absolute inset-0 flex items-center justify-center text-center px-6 font-display font-bold text-xl"></div>
          </div>

          <div class="mt-6 flex items-center justify-between text-sm">
            <div><span class="text-[var(--muted)]">Best:</span> <span id="reflex-best" class="font-mono font-bold"></span></div>
            <button id="reflex-reset" type="button" class="font-mono text-xs text-[var(--muted)] hover:opacity-80 underline">Reset stats</button>
          </div>

          <div class="mt-5">
            <div class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)] mb-2">Recent attempts</div>
            <div id="reflex-history" class="flex flex-col gap-1.5 text-sm"></div>
          </div>
        </div>
      `;

      stageEl = root.querySelector('#reflex-stage');
      messageEl = root.querySelector('#reflex-message');
      stageEl.addEventListener('click', handleAction);
      document.addEventListener('keydown', handleKeydown);

      renderDifficultyPicker(root.querySelector('#reflex-difficulty'), '--accent');
      root.querySelector('#reflex-reset').addEventListener('click', () => {
        if (!confirm('Reset your Reflex Tester stats? This can\'t be undone.')) return;
        Storage.reset('reflex');
        stats = { best: null, attempts: [] };
        renderStats();
      });

      renderIdle();
      renderLivesUI();
      renderProgress();
      renderStats();
      renderDifficultyVisibility();
    }

    function unmount() {
      clearTimeout(waitTimeoutId);
      if (approachHandle) approachHandle.cancel();
      document.removeEventListener('keydown', handleKeydown);
    }

    function handleAction() {
      if (session === 'idle' || session === 'ended') {
        startHunt();
      } else if (session === 'hunting' && encounter === 'lurking') {
        falseStart();
      } else if (session === 'hunting' && encounter === 'approaching' && mode === 'click') {
        killMonster(performance.now() - cueShownAt);
      }
    }

    function handleKeydown(e) {
      if (e.repeat || e.key.length !== 1) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (session !== 'hunting') return;

      if (encounter === 'lurking') {
        falseStart();
        return;
      }
      if (encounter === 'approaching' && mode === 'type') {
        const expected = currentWord[typedBuffer.length];
        if (e.key.toUpperCase() === expected) {
          typedBuffer += expected;
          renderTypeProgress();
          if (typedBuffer.length === currentWord.length) {
            killMonster(performance.now() - cueShownAt);
          }
        } else {
          typedBuffer = '';
          renderTypeProgress();
        }
      }
    }

    function startHunt() {
      session = 'hunting';
      lives = REFLEX_LIVES;
      kills = 0;
      renderLivesUI();
      renderProgress();
      renderDifficultyVisibility();
      spawnEncounter();
    }

    function spawnEncounter() {
      encounter = 'lurking';
      messageEl.style.opacity = '1';
      messageEl.textContent = 'Something’s coming…';
      const delay = 1500 + Math.random() * 2500;
      waitTimeoutId = setTimeout(beginApproach, delay);
    }

    function beginApproach() {
      encounter = 'approaching';
      mode = Math.random() < 0.5 ? 'click' : 'type';
      currentWord = mode === 'type' ? randomWord() : '';
      typedBuffer = '';
      cueShownAt = performance.now();

      messageEl.style.opacity = '0';
      monsterEl = createMonsterEl();
      monsterEl.style.left = '50%';
      monsterEl.style.top = '50%';
      monsterEl.style.transform = 'translate(-50%, -50%) scale(0.25)';
      monsterEl.style.marginLeft = '-50px';
      monsterEl.style.marginTop = '-54px';
      stageEl.appendChild(monsterEl);

      if (mode === 'type') {
        const label = document.createElement('div');
        label.id = 'reflex-word';
        label.className = 'absolute left-1/2 top-[18%] -translate-x-1/2 font-mono font-bold text-lg tracking-widest';
        stageEl.appendChild(label);
        renderTypeProgress();
      }

      const duration = REFLEX_BASE_MS * DIFFICULTY_MULTIPLIERS[getDifficulty()];
      approachHandle = startApproach(monsterEl, duration, onReached);
    }

    function onReached(finalScale) {
      monsterEl.style.setProperty('--ms', finalScale);
      monsterEl.classList.add('monster-reached');
      lives--;
      renderLivesUI();
      stageEl.classList.add('stage-shake');
      setTimeout(() => stageEl.classList.remove('stage-shake'), 260);
      recordAttempt({ ms: null, falseStart: false, timedOut: true, mode, ts: Date.now() });
      monsterEl.addEventListener('animationend', () => { cleanupEncounter(); afterEncounter(); }, { once: true });
    }

    function killMonster(ms) {
      approachHandle.cancel();
      monsterEl.style.setProperty('--ms', approachHandle.scale());
      monsterEl.classList.add('monster-death');
      const label = root.querySelector('#reflex-word');
      if (label) label.remove();
      kills++;
      renderProgress();
      recordAttempt({ ms: Math.round(ms), falseStart: false, timedOut: false, mode, ts: Date.now() });
      monsterEl.addEventListener('animationend', () => { cleanupEncounter(); afterEncounter(); }, { once: true });
    }

    function falseStart() {
      clearTimeout(waitTimeoutId);
      messageEl.style.opacity = '1';
      messageEl.textContent = 'Too soon!';
      recordAttempt({ ms: null, falseStart: true, timedOut: false, mode: null, ts: Date.now() });
      renderStats();
      setTimeout(() => { if (session === 'hunting') spawnEncounter(); }, 700);
    }

    function cleanupEncounter() {
      if (monsterEl) { monsterEl.remove(); monsterEl = null; }
      const label = root.querySelector('#reflex-word');
      if (label) label.remove();
    }

    function afterEncounter() {
      renderStats();
      if (session !== 'hunting') return;
      if (lives <= 0) { endHunt('defeat'); return; }
      if (kills >= REFLEX_TOTAL) { endHunt('victory'); return; }
      spawnEncounter();
    }

    function endHunt(result) {
      session = 'ended';
      messageEl.style.opacity = '1';
      messageEl.innerHTML = result === 'victory'
        ? `<div><div class="text-2xl mb-1">Hunt complete!</div><div class="text-sm font-body font-normal text-[var(--muted)]">${kills} defeated · ${lives} ${lives === 1 ? 'life' : 'lives'} left — click to hunt again</div></div>`
        : `<div><div class="text-2xl mb-1">The Hair Monster got you</div><div class="text-sm font-body font-normal text-[var(--muted)]">${kills} defeated — click to try again</div></div>`;
      renderDifficultyVisibility();
    }

    function renderIdle() {
      messageEl.textContent = 'Click to start the hunt';
    }

    function renderDifficultyVisibility() {
      const row = root.querySelector('#reflex-difficulty-row');
      row.style.display = session === 'hunting' ? 'none' : 'flex';
    }

    function renderTypeProgress() {
      const wordEl = root.querySelector('#reflex-word');
      if (!wordEl) return;
      const done = currentWord.slice(0, typedBuffer.length);
      const rest = currentWord.slice(typedBuffer.length);
      wordEl.innerHTML = `<span class="opacity-100">${done}</span><span class="opacity-45">${rest}</span>`;
    }

    function renderLivesUI() {
      renderLives(root.querySelector('#reflex-lives'), lives, REFLEX_LIVES);
    }

    function renderProgress() {
      root.querySelector('#reflex-progress').textContent = session === 'idle' ? '' : `${kills}/${REFLEX_TOTAL} defeated`;
    }

    function recordAttempt(attempt) {
      stats.attempts.unshift(attempt);
      stats.attempts = stats.attempts.slice(0, 20);
      if (!attempt.falseStart && !attempt.timedOut && (stats.best === null || attempt.ms < stats.best)) {
        stats.best = attempt.ms;
      }
      Storage.save('reflex', stats);
    }

    function renderStats() {
      root.querySelector('#reflex-best').textContent = stats.best === null ? '—' : formatMs(stats.best);

      const historyEl = root.querySelector('#reflex-history');
      if (!stats.attempts.length) {
        historyEl.innerHTML = `<div class="text-[var(--muted)]">No attempts yet.</div>`;
        return;
      }
      historyEl.innerHTML = stats.attempts.map(a => {
        if (a.falseStart) {
          return `<div class="flex items-center justify-between"><span class="text-[var(--muted)]">False start</span><span class="font-mono text-[var(--muted)]">—</span></div>`;
        }
        if (a.timedOut) {
          return `<div class="flex items-center justify-between"><span class="text-[var(--muted)]">Too slow (${a.mode})</span><span class="font-mono text-[var(--muted)]">—</span></div>`;
        }
        return `<div class="flex items-center justify-between"><span class="text-[var(--muted)]">${a.mode === 'type' ? 'Typed' : 'Clicked'}</span><span class="font-mono font-semibold">${formatMs(a.ms)}</span></div>`;
      }).join('');
    }

    ToolRegistry.register({
      id: 'reflex',
      name: 'Reflex Tester',
      color: 'var(--accent)',
      icon: ICON,
      tagline: 'The Hair Monster strikes fast — wait for the cue and click before it gets away.',
      mount,
      unmount,
    });
  })();

  // ===== TOOL: Aim Tester =====
  // A hunt of up to AIM_TOTAL monsters with LIVES lives. Each monster
  // spawns at a random position and grows over AIM_APPROACH_MS — click it
  // (mode 'click') or type the word shown by it (mode 'type') before it
  // reaches you. A wrong keystroke or a stray click on empty space is a
  // "miss" (cosmetic, no life lost); a monster reaching you costs a life.
  // Hunt ends at 20 kills (victory) or 0 lives (defeat).
  (() => {
    const ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>`;
    const AIM_TOTAL = 20;
    const AIM_LIVES = 3;
    const AIM_BASE_MS = 2800; // approach time at 'normal' difficulty

    let root, areaEl, overlayEl, livesEl, monsterEl, wordEl, approachHandle;
    let session = 'idle'; // idle | hunting | ended
    let kills = 0;
    let timeouts = 0;
    let misses = 0;
    let lives = AIM_LIVES;
    let hitTimes = [];
    let huntStartedAt = 0;
    let monsterShownAt = 0;
    let currentMode = null; // 'click' | 'type'
    let currentWord = '';
    let typedBuffer = '';
    let stats = { best: null, attempts: [] };

    function mount(container) {
      root = container;
      session = 'idle';
      kills = 0; timeouts = 0; misses = 0; lives = AIM_LIVES; hitTimes = [];
      monsterEl = null; wordEl = null; approachHandle = null;
      stats = Storage.load('aim', { best: null, attempts: [] });

      root.innerHTML = `
        <div class="max-w-[820px]">
          <a href="#home" class="font-mono text-xs font-bold text-[var(--muted)] hover:opacity-80 inline-block mb-6">&larr; Back to hunts</a>
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-[11px] flex items-center justify-center text-white" style="background:var(--accent-2)">${ICON}</div>
            <h1 class="font-display font-bold text-2xl">Aim Tester</h1>
          </div>
          <p class="text-sm text-[var(--muted)] mb-3">Click the monster. Type the word it shows. Don't let it reach you. ${AIM_TOTAL} to defeat, ${AIM_LIVES} lives.</p>

          <div id="aim-difficulty-row" class="flex items-center gap-2 mb-3">
            <span class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)]">Speed</span>
            <div id="aim-difficulty"></div>
          </div>

          <div class="flex items-center gap-6 mb-4">
            <div id="aim-lives" class="flex items-center gap-1"></div>
            <div><span class="text-[var(--muted)] text-sm">Best:</span> <span id="aim-best" class="font-mono font-bold text-sm"></span></div>
            <div id="aim-progress" class="font-mono text-sm text-[var(--muted)]"></div>
          </div>

          <div id="aim-area" class="relative w-full h-[420px] rounded-[18px] border border-[var(--border)] bg-white dark:bg-[var(--surface)] overflow-hidden" style="cursor:crosshair;"></div>

          <div class="mt-6 flex items-center justify-between">
            <div class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)]">Recent hunts</div>
            <button id="aim-reset" type="button" class="font-mono text-xs text-[var(--muted)] hover:opacity-80 underline">Reset stats</button>
          </div>
          <div id="aim-history" class="flex flex-col gap-1.5 text-sm mt-2"></div>
        </div>
      `;

      areaEl = root.querySelector('#aim-area');
      livesEl = root.querySelector('#aim-lives');
      areaEl.addEventListener('click', handleAreaClick);
      document.addEventListener('keydown', handleKeydown);

      renderDifficultyPicker(root.querySelector('#aim-difficulty'), '--accent-2');
      root.querySelector('#aim-reset').addEventListener('click', () => {
        if (!confirm('Reset your Aim Tester stats? This can\'t be undone.')) return;
        Storage.reset('aim');
        stats = { best: null, attempts: [] };
        renderStats();
      });

      showStartOverlay();
      renderLivesUI();
      renderProgress();
      renderStats();
      renderDifficultyVisibility();
    }

    function unmount() {
      session = 'idle';
      if (approachHandle) approachHandle.cancel();
      document.removeEventListener('keydown', handleKeydown);
    }

    function showStartOverlay() {
      areaEl.innerHTML = '';
      overlayEl = document.createElement('div');
      overlayEl.className = 'absolute inset-0 flex items-center justify-center';
      overlayEl.innerHTML = `<button type="button" class="font-display font-bold text-lg px-6 py-3 rounded-xl text-white" style="background:var(--accent-2)">Start hunt</button>`;
      overlayEl.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); startHunt(); });
      areaEl.appendChild(overlayEl);
    }

    function startHunt() {
      session = 'hunting';
      kills = 0; timeouts = 0; misses = 0; lives = AIM_LIVES; hitTimes = [];
      if (overlayEl) { overlayEl.remove(); overlayEl = null; }
      huntStartedAt = performance.now();
      renderLivesUI();
      renderProgress();
      renderDifficultyVisibility();
      spawnMonster();
    }

    function renderWordSpans() {
      const done = currentWord.slice(0, typedBuffer.length);
      const rest = currentWord.slice(typedBuffer.length);
      return `<span class="opacity-100">${done}</span><span class="opacity-45">${rest}</span>`;
    }

    function spawnMonster() {
      currentMode = Math.random() < 0.5 ? 'click' : 'type';
      typedBuffer = '';
      currentWord = currentMode === 'type' ? randomWord() : '';

      const leftPct = 12 + Math.random() * 76;
      const topPct = 15 + Math.random() * 70;

      monsterEl = createMonsterEl();
      monsterEl.dataset.target = 'true';
      monsterEl.style.left = leftPct + '%';
      monsterEl.style.top = topPct + '%';
      monsterEl.style.marginLeft = '-50px';
      monsterEl.style.marginTop = '-54px';
      monsterEl.style.transform = 'scale(0.25)';
      areaEl.appendChild(monsterEl);

      if (currentMode === 'type') {
        wordEl = document.createElement('div');
        wordEl.className = 'absolute font-mono font-bold text-sm text-white px-2 py-1 rounded-md whitespace-nowrap';
        wordEl.style.background = 'var(--accent)';
        wordEl.style.left = leftPct + '%';
        wordEl.style.top = `calc(${topPct}% - 46px)`;
        wordEl.style.transform = 'translateX(-50%)';
        wordEl.innerHTML = renderWordSpans();
        areaEl.appendChild(wordEl);
      }

      monsterShownAt = performance.now();
      const duration = AIM_BASE_MS * DIFFICULTY_MULTIPLIERS[getDifficulty()];
      approachHandle = startApproach(monsterEl, duration, onReached);
    }

    function onReached(finalScale) {
      monsterEl.style.setProperty('--ms', finalScale);
      monsterEl.classList.add('monster-reached');
      timeouts++;
      lives--;
      renderLivesUI();
      areaEl.classList.add('stage-shake');
      setTimeout(() => areaEl.classList.remove('stage-shake'), 260);
      if (wordEl) { wordEl.remove(); wordEl = null; }
      monsterEl.addEventListener('animationend', () => { monsterEl.remove(); monsterEl = null; afterMonster(); }, { once: true });
    }

    function handleAreaClick(e) {
      if (session !== 'hunting') return;
      const hitEl = e.target.closest('[data-target]');
      if (hitEl && currentMode === 'click') {
        registerKill();
      } else if (!hitEl) {
        misses++;
        renderProgress();
      }
    }

    function handleKeydown(e) {
      if (session !== 'hunting' || currentMode !== 'type') return;
      if (e.repeat || e.key.length !== 1) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const expected = currentWord[typedBuffer.length];
      if (e.key.toUpperCase() === expected) {
        typedBuffer += expected;
        if (wordEl) wordEl.innerHTML = renderWordSpans();
        if (typedBuffer.length === currentWord.length) {
          registerKill();
        }
      } else {
        typedBuffer = '';
        misses++;
        renderProgress();
        if (wordEl) wordEl.innerHTML = renderWordSpans();
      }
    }

    function registerKill() {
      approachHandle.cancel();
      hitTimes.push(performance.now() - monsterShownAt);
      monsterEl.style.setProperty('--ms', approachHandle.scale());
      monsterEl.classList.add('monster-death');
      if (wordEl) { wordEl.remove(); wordEl = null; }
      kills++;
      renderProgress();
      monsterEl.addEventListener('animationend', () => { monsterEl.remove(); monsterEl = null; afterMonster(); }, { once: true });
    }

    function afterMonster() {
      if (session !== 'hunting') return;
      if (lives <= 0) { finishHunt('defeat'); return; }
      if (kills >= AIM_TOTAL) { finishHunt('victory'); return; }
      spawnMonster();
    }

    function finishHunt(result) {
      session = 'ended';
      const totalMs = performance.now() - huntStartedAt;
      const encountered = kills + timeouts;
      const accuracyPct = encountered > 0 ? Math.round((kills / encountered) * 100) : 0;
      const avgMs = hitTimes.length ? Math.round(hitTimes.reduce((a, b) => a + b, 0) / hitTimes.length) : null;
      const attempt = { accuracyPct, avgMs, totalMs: Math.round(totalMs), kills, timeouts, misses, result, ts: Date.now() };
      recordAttempt(attempt);
      renderResult(attempt);
      renderStats();
      renderDifficultyVisibility();
    }

    function renderDifficultyVisibility() {
      const row = root.querySelector('#aim-difficulty-row');
      row.style.display = session === 'hunting' ? 'none' : 'flex';
    }

    function recordAttempt(attempt) {
      stats.attempts.unshift(attempt);
      stats.attempts = stats.attempts.slice(0, 20);
      const better = !stats.best || attempt.kills > stats.best.kills ||
        (attempt.kills === stats.best.kills && attempt.avgMs !== null && (stats.best.avgMs === null || attempt.avgMs < stats.best.avgMs));
      if (better) stats.best = attempt;
      Storage.save('aim', stats);
    }

    function renderResult(attempt) {
      overlayEl = document.createElement('div');
      overlayEl.className = 'absolute inset-0 flex flex-col items-center justify-center gap-2 text-center px-6';
      overlayEl.style.background = 'color-mix(in oklab, var(--bg) 88%, transparent)';
      const title = attempt.result === 'victory' ? 'Hunt complete!' : 'The Hair Monster got you';
      overlayEl.innerHTML = `
        <div class="font-display font-bold text-2xl">${title}</div>
        <div class="text-sm text-[var(--muted)]">${attempt.kills} defeated · ${attempt.accuracyPct}% accuracy${attempt.avgMs !== null ? ` · ${formatMs(attempt.avgMs)} avg` : ''}</div>
        <button type="button" class="mt-2 font-display font-bold text-lg px-6 py-3 rounded-xl text-white" style="background:var(--accent-2)">Hunt again</button>
      `;
      overlayEl.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); startHunt(); });
      areaEl.appendChild(overlayEl);
    }

    function renderLivesUI() {
      renderLives(livesEl, lives, AIM_LIVES);
    }

    function renderProgress() {
      const el = root.querySelector('#aim-progress');
      el.textContent = session === 'idle' ? '' : `${kills}/${AIM_TOTAL} · ${misses} miss${misses === 1 ? '' : 'es'}`;
    }

    function renderStats() {
      root.querySelector('#aim-best').textContent = stats.best ? `${stats.best.kills}/${AIM_TOTAL} kills (${stats.best.accuracyPct}%)` : '—';

      const historyEl = root.querySelector('#aim-history');
      if (!stats.attempts.length) {
        historyEl.innerHTML = `<div class="text-[var(--muted)]">No hunts yet.</div>`;
        return;
      }
      historyEl.innerHTML = stats.attempts.map(a => `
        <div class="flex items-center justify-between">
          <span class="text-[var(--muted)]">${a.kills}/${AIM_TOTAL} defeated (${a.result === 'victory' ? 'won' : 'defeated'})</span>
          <span class="font-mono font-semibold">${a.avgMs !== null ? formatMs(a.avgMs) + ' avg' : '—'}</span>
        </div>
      `).join('');
    }

    ToolRegistry.register({
      id: 'aim',
      name: 'Aim Tester',
      color: 'var(--accent-2)',
      icon: ICON,
      tagline: 'Line up your shot. Click 20 targets to take the Hair Monster down.',
      mount,
      unmount,
    });
  })();

  // ===== Bootstrap =====
  buildSidebarNav();
  window.addEventListener('hashchange', renderRoute);
  renderRoute();
</script>

</body>
</html>
