<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP Hair Monster Hunt</title>

<script>
  (function () {
    try {
      var saved = localStorage.getItem('portal.theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['"Plus Jakarta Sans"', 'sans-serif'],
          mono: ['"Space Mono"', 'monospace'],
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">

<style>
  :root {
    --bg: oklch(0.98 0.012 300);
    --surface: oklch(0.955 0.018 300);
    --border: oklch(0.89 0.02 300);
    --ink: oklch(0.22 0.03 300);
    --muted: oklch(0.5 0.02 300);
    --accent: #7C4DFF;
    --accent-2: oklch(0.72 0.13 200);
    --card-shadow: 0 1px 2px oklch(0.2 0.02 300 / 0.06);
  }
  .dark {
    --bg: oklch(0.16 0.02 300);
    --surface: oklch(0.21 0.02 300);
    --border: oklch(0.32 0.03 300);
    --ink: oklch(0.95 0.02 300);
    --muted: oklch(0.65 0.02 300);
    --card-shadow: 0 1px 2px oklch(0 0 0 / 0.4);
  }
</style>
</head>
<body>

<div class="flex h-screen overflow-hidden bg-[var(--bg)] text-[var(--ink)] font-body">

  <aside class="w-[272px] shrink-0 bg-[var(--surface)] border-r border-[var(--border)] flex flex-col p-5 overflow-y-auto">
    <div class="flex items-start justify-between mb-1.5">
      <a href="#home" class="font-display font-bold text-lg leading-tight tracking-tight max-w-[172px] hover:opacity-80">Hair Monster Hunt</a>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="w-9 h-9 shrink-0 rounded-[10px] border border-[var(--border)] bg-white dark:bg-[var(--surface)] flex items-center justify-center hover:opacity-80">
        <svg class="dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <p class="text-[13px] text-[var(--muted)] leading-relaxed mb-7">Sharpen your reflexes and aim — hunt down the SP Hair Monster.</p>

    <div class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)] mb-2.5">Tools</div>
    <nav id="tool-nav" class="flex flex-col gap-1.5"></nav>
  </aside>

  <main id="content" class="flex-1 overflow-y-auto p-8 sm:p-14"></main>

</div>

<script>
  // ===== Tool registry =====
  const ToolRegistry = (() => {
    const tools = [];
    return {
      register(tool) { tools.push(tool); },
      get(id) { return tools.find(t => t.id === id); },
      all() { return tools.slice(); },
    };
  })();

  // ===== Storage helper (shared localStorage wrapper) =====
  const Storage = {
    load(toolId, fallback) {
      try {
        const raw = localStorage.getItem(`portal.${toolId}.stats`);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    },
    save(toolId, data) {
      try { localStorage.setItem(`portal.${toolId}.stats`, JSON.stringify(data)); } catch (e) {}
    },
  };

  // ===== Shared word list (used by both click and type challenges) =====
  const HAIR_MONSTER_WORDS = ['FANG', 'CLAW', 'FUR', 'HAIR', 'SNARL', 'YETI', 'BITE', 'MANE', 'COMB', 'SHED', 'GROWL', 'SHAG'];
  function randomWord() {
    return HAIR_MONSTER_WORDS[Math.floor(Math.random() * HAIR_MONSTER_WORDS.length)];
  }
  function formatMs(ms) {
    return `${Math.round(ms)}ms`;
  }

  // ===== Theme toggle =====
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('portal.theme', dark ? 'dark' : 'light'); } catch (e) {}
  });

  // ===== Sidebar nav =====
  function buildSidebarNav() {
    const nav = document.getElementById('tool-nav');
    nav.innerHTML = '';
    ToolRegistry.all().forEach(tool => {
      const a = document.createElement('a');
      a.href = `#${tool.id}`;
      a.dataset.toolId = tool.id;
      a.className = 'flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-semibold text-sm';
      a.innerHTML = `${tool.icon}<span>${tool.name}</span>`;
      nav.appendChild(a);
    });
  }

  function updateActiveNav(activeId) {
    document.querySelectorAll('#tool-nav a').forEach(a => {
      const tool = ToolRegistry.get(a.dataset.toolId);
      const isActive = a.dataset.toolId === activeId;
      a.style.background = isActive ? tool.color : 'transparent';
      a.style.color = isActive ? '#fff' : 'var(--ink)';
      if (isActive) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  // ===== Welcome / not-found panels =====
  function renderWelcome(container) {
    container.innerHTML = `
      <div class="max-w-[640px]">
        <h1 class="font-display font-bold text-4xl leading-tight tracking-tight mb-3.5">Hunt the SP Hair Monster</h1>
        <p class="text-base leading-relaxed text-[var(--muted)] mb-10">Pick a tool from the sidebar and take it on. New hunts join the collection over time — this is just the start.</p>
      </div>
      <div id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 max-w-[920px]"></div>
    `;
    const grid = container.querySelector('#tool-grid');
    ToolRegistry.all().forEach(tool => grid.appendChild(renderToolCard(tool)));

    const ghost = document.createElement('div');
    ghost.className = 'border-[1.5px] border-dashed border-[var(--border)] rounded-[18px] p-[22px] flex flex-col items-start justify-center gap-2.5 text-[var(--muted)]';
    ghost.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <div class="text-[13px] font-semibold">More hunts coming soon</div>
    `;
    grid.appendChild(ghost);
  }

  function renderToolCard(tool) {
    const card = document.createElement('a');
    card.href = `#${tool.id}`;
    card.className = 'bg-white dark:bg-[var(--surface)] border border-[var(--border)] rounded-[18px] p-[22px] flex flex-col gap-3.5 shadow-[var(--card-shadow)] hover:opacity-90';
    card.innerHTML = `
      <div class="w-10 h-10 rounded-[11px] flex items-center justify-center text-white" style="background:${tool.color}">${tool.icon}</div>
      <div>
        <div class="font-bold text-base mb-1">${tool.name}</div>
        <div class="text-[13.5px] text-[var(--muted)] leading-snug">${tool.tagline}</div>
      </div>
      <div class="font-mono text-[12.5px] font-bold flex items-center gap-1 mt-auto" style="color:${tool.color}">Hunt &rarr;</div>
    `;
    return card;
  }

  function renderNotFound(container, id) {
    container.innerHTML = `
      <div class="max-w-[480px]">
        <h1 class="font-display font-bold text-2xl mb-3">No hunt called "${id}"</h1>
        <p class="text-[var(--muted)] mb-6">That tool doesn't exist (yet?). Head back and pick one from the list.</p>
        <a href="#home" class="font-mono text-sm font-bold" style="color:var(--accent)">&larr; Back home</a>
      </div>
    `;
  }

  // ===== Router =====
  const content = document.getElementById('content');
  let currentTool = null;

  function getRouteFromHash() {
    const id = location.hash.replace(/^#/, '').trim();
    return id || 'home';
  }

  function renderRoute() {
    const id = getRouteFromHash();
    if (currentTool && currentTool.unmount) currentTool.unmount();
    currentTool = null;
    content.innerHTML = '';

    if (id === 'home') {
      renderWelcome(content);
      updateActiveNav(null);
      document.title = 'SP Hair Monster Hunt';
      return;
    }
    const tool = ToolRegistry.get(id);
    if (!tool) {
      renderNotFound(content, id);
      updateActiveNav(null);
      document.title = 'SP Hair Monster Hunt';
      return;
    }
    tool.mount(content);
    currentTool = tool;
    updateActiveNav(id);
    document.title = `${tool.name} · SP Hair Monster Hunt`;
  }

  // ===== TOOL: Reflex Tester =====
  // State machine: idle -> waiting -> ready -> result, with a falseStart
  // branch off waiting. Each round randomly picks a mode ('click' or
  // 'type') at cue time, so both false-start guards (a stray click AND a
  // stray keypress during 'waiting') must be handled.
  (() => {
    const ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>`;

    let root, stageEl;
    let state = 'idle'; // idle | waiting | ready | result | falseStart
    let mode = null; // 'click' | 'type'
    let waitTimeoutId = null;
    let cueShownAt = 0;
    let currentWord = '';
    let typedBuffer = '';
    let lastResult = null;
    let stats = { best: null, attempts: [] };

    function mount(container) {
      root = container;
      state = 'idle';
      mode = null;
      waitTimeoutId = null;
      typedBuffer = '';
      currentWord = '';
      lastResult = null;
      stats = Storage.load('reflex', { best: null, attempts: [] });

      root.innerHTML = `
        <div class="max-w-[560px]">
          <a href="#home" class="font-mono text-xs font-bold text-[var(--muted)] hover:opacity-80 inline-block mb-6">&larr; Back to hunts</a>
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-[11px] flex items-center justify-center text-white" style="background:var(--accent)">${ICON}</div>
            <h1 class="font-display font-bold text-2xl">Reflex Tester</h1>
          </div>
          <p class="text-sm text-[var(--muted)] mb-6">The Hair Monster attacks with a click <em>or</em> a word — wait for it, then react as fast as you can. Jumping the gun counts as a false start.</p>

          <button id="reflex-stage" type="button" class="w-full h-56 rounded-[18px] flex items-center justify-center gap-2 text-white font-display font-bold text-2xl select-none"></button>

          <div class="mt-6 text-sm">
            <span class="text-[var(--muted)]">Best:</span> <span id="reflex-best" class="font-mono font-bold"></span>
          </div>

          <div class="mt-5">
            <div class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)] mb-2">Recent attempts</div>
            <div id="reflex-history" class="flex flex-col gap-1.5 text-sm"></div>
          </div>
        </div>
      `;

      stageEl = root.querySelector('#reflex-stage');
      stageEl.addEventListener('click', handleStageClick);
      document.addEventListener('keydown', handleKeydown);

      renderStage();
      renderStats();
    }

    function unmount() {
      clearTimeout(waitTimeoutId);
      document.removeEventListener('keydown', handleKeydown);
    }

    function handleStageClick() {
      if (state === 'idle' || state === 'result' || state === 'falseStart') {
        startRound();
      } else if (state === 'waiting') {
        registerFalseStart();
      } else if (state === 'ready' && mode === 'click') {
        registerHit(performance.now() - cueShownAt);
      }
    }

    function handleKeydown(e) {
      if (e.repeat || e.key.length !== 1) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (state === 'waiting') {
        registerFalseStart();
        return;
      }
      if (state === 'ready' && mode === 'type') {
        const expected = currentWord[typedBuffer.length];
        if (e.key.toUpperCase() === expected) {
          typedBuffer += expected;
          renderTypeProgress();
          if (typedBuffer.length === currentWord.length) {
            registerHit(performance.now() - cueShownAt);
          }
        } else {
          typedBuffer = '';
          renderTypeProgress();
        }
      }
    }

    function startRound() {
      mode = Math.random() < 0.5 ? 'click' : 'type';
      currentWord = mode === 'type' ? randomWord() : '';
      typedBuffer = '';
      state = 'waiting';
      renderStage();
      const delay = 1500 + Math.random() * 2500;
      waitTimeoutId = setTimeout(() => {
        state = 'ready';
        cueShownAt = performance.now();
        renderStage();
      }, delay);
    }

    function registerFalseStart() {
      clearTimeout(waitTimeoutId);
      state = 'falseStart';
      recordAttempt({ ms: null, falseStart: true, mode, ts: Date.now() });
      renderStage();
      renderStats();
    }

    function registerHit(ms) {
      state = 'result';
      lastResult = { ms, mode };
      recordAttempt({ ms: Math.round(ms), falseStart: false, mode, ts: Date.now() });
      renderStage();
      renderStats();
    }

    function recordAttempt(attempt) {
      stats.attempts.unshift(attempt);
      stats.attempts = stats.attempts.slice(0, 20);
      if (!attempt.falseStart && (stats.best === null || attempt.ms < stats.best)) {
        stats.best = attempt.ms;
      }
      Storage.save('reflex', stats);
    }

    function renderStage() {
      if (state === 'idle') {
        stageEl.style.background = 'var(--muted)';
        stageEl.textContent = 'Click to start';
      } else if (state === 'waiting') {
        stageEl.style.background = 'var(--muted)';
        stageEl.textContent = 'Wait for it…';
      } else if (state === 'ready' && mode === 'click') {
        stageEl.style.background = 'var(--accent)';
        stageEl.textContent = 'CLICK NOW';
      } else if (state === 'ready' && mode === 'type') {
        stageEl.style.background = 'var(--accent)';
        stageEl.innerHTML = `<span id="reflex-word" class="font-mono tracking-widest"></span>`;
        renderTypeProgress();
      } else if (state === 'falseStart') {
        stageEl.style.background = 'oklch(0.62 0.19 25)';
        stageEl.textContent = 'Too soon! Click to retry';
      } else if (state === 'result') {
        stageEl.style.background = 'var(--accent-2)';
        const label = lastResult.mode === 'type' ? 'typed' : 'clicked';
        stageEl.innerHTML = `${formatMs(lastResult.ms)} <span class="text-sm font-body font-normal opacity-80 ml-2">(${label} — click to retry)</span>`;
      }
    }

    function renderTypeProgress() {
      const wordEl = document.getElementById('reflex-word');
      if (!wordEl) return;
      const done = currentWord.slice(0, typedBuffer.length);
      const rest = currentWord.slice(typedBuffer.length);
      wordEl.innerHTML = `<span class="opacity-100">${done}</span><span class="opacity-45">${rest}</span>`;
    }

    function renderStats() {
      root.querySelector('#reflex-best').textContent = stats.best === null ? '—' : formatMs(stats.best);

      const historyEl = root.querySelector('#reflex-history');
      if (!stats.attempts.length) {
        historyEl.innerHTML = `<div class="text-[var(--muted)]">No attempts yet.</div>`;
        return;
      }
      historyEl.innerHTML = stats.attempts.map(a => {
        if (a.falseStart) {
          return `<div class="flex items-center justify-between"><span class="text-[var(--muted)]">False start (${a.mode})</span><span class="font-mono text-[var(--muted)]">—</span></div>`;
        }
        return `<div class="flex items-center justify-between"><span class="text-[var(--muted)]">${a.mode === 'type' ? 'Typed' : 'Clicked'}</span><span class="font-mono font-semibold">${formatMs(a.ms)}</span></div>`;
      }).join('');
    }

    ToolRegistry.register({
      id: 'reflex',
      name: 'Reflex Tester',
      color: 'var(--accent)',
      icon: ICON,
      tagline: 'The Hair Monster strikes fast — wait for the cue and click before it gets away.',
      mount,
      unmount,
    });
  })();

  // ===== TOOL: Aim Tester =====
  // Fixed 20-target round. Each target is randomly a click-target (a
  // circle at a random position) or a type-target (a word chip) — one
  // delegated click handler covers clicks, one document keydown handler
  // covers typing, both gated on roundActive/currentMode.
  (() => {
    const ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>`;
    const TARGET_COUNT = 20;

    let root, areaEl, overlayEl, currentTargetEl;
    let roundActive = false;
    let targetIndex = 0;
    let hitTimes = [];
    let misses = 0;
    let roundStartedAt = 0;
    let targetShownAt = 0;
    let currentMode = null; // 'click' | 'type'
    let currentWord = '';
    let typedBuffer = '';
    let stats = { best: null, attempts: [] };

    function mount(container) {
      root = container;
      roundActive = false;
      targetIndex = 0;
      hitTimes = [];
      misses = 0;
      currentTargetEl = null;
      stats = Storage.load('aim', { best: null, attempts: [] });

      root.innerHTML = `
        <div class="max-w-[820px]">
          <a href="#home" class="font-mono text-xs font-bold text-[var(--muted)] hover:opacity-80 inline-block mb-6">&larr; Back to hunts</a>
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-[11px] flex items-center justify-center text-white" style="background:var(--accent-2)">${ICON}</div>
            <h1 class="font-display font-bold text-2xl">Aim Tester</h1>
          </div>
          <p class="text-sm text-[var(--muted)] mb-2">Click the circles. Type the words. 20 targets, one hunt — go for speed and accuracy.</p>
          <div class="flex items-center gap-6 text-sm mb-4">
            <div><span class="text-[var(--muted)]">Best avg:</span> <span id="aim-best" class="font-mono font-bold"></span></div>
            <div id="aim-progress" class="font-mono text-[var(--muted)]"></div>
          </div>

          <div id="aim-area" class="relative w-full h-[420px] rounded-[18px] border border-[var(--border)] bg-white dark:bg-[var(--surface)] overflow-hidden" style="cursor:crosshair;"></div>

          <div class="mt-6">
            <div class="text-[11px] font-bold tracking-wider uppercase text-[var(--muted)] mb-2">Recent hunts</div>
            <div id="aim-history" class="flex flex-col gap-1.5 text-sm"></div>
          </div>
        </div>
      `;

      areaEl = root.querySelector('#aim-area');
      areaEl.addEventListener('click', handleAreaClick);
      document.addEventListener('keydown', handleKeydown);

      showStartOverlay();
      renderProgress();
      renderStats();
    }

    function unmount() {
      roundActive = false;
      document.removeEventListener('keydown', handleKeydown);
    }

    function showStartOverlay() {
      areaEl.innerHTML = '';
      overlayEl = document.createElement('div');
      overlayEl.className = 'absolute inset-0 flex items-center justify-center';
      overlayEl.innerHTML = `<button type="button" class="font-display font-bold text-lg px-6 py-3 rounded-xl text-white" style="background:var(--accent-2)">Start hunt</button>`;
      overlayEl.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); startRound(); });
      areaEl.appendChild(overlayEl);
    }

    function startRound() {
      roundActive = true;
      targetIndex = 0;
      hitTimes = [];
      misses = 0;
      if (overlayEl) { overlayEl.remove(); overlayEl = null; }
      roundStartedAt = performance.now();
      spawnTarget();
      renderProgress();
    }

    function renderWordSpans() {
      const done = currentWord.slice(0, typedBuffer.length);
      const rest = currentWord.slice(typedBuffer.length);
      return `<span class="opacity-100">${done}</span><span class="opacity-45">${rest}</span>`;
    }

    function spawnTarget() {
      currentMode = Math.random() < 0.5 ? 'click' : 'type';
      typedBuffer = '';
      currentWord = currentMode === 'type' ? randomWord() : '';

      const leftPct = 10 + Math.random() * 80;
      const topPct = 10 + Math.random() * 80;

      const el = document.createElement(currentMode === 'click' ? 'button' : 'div');
      el.dataset.target = 'true';
      el.style.position = 'absolute';
      el.style.left = leftPct + '%';
      el.style.top = topPct + '%';
      el.style.transform = 'translate(-50%, -50%)';

      if (currentMode === 'click') {
        el.className = 'w-11 h-11 rounded-full border-2 border-white';
        el.style.background = 'var(--accent-2)';
      } else {
        el.className = 'px-3 py-1.5 rounded-lg font-mono text-sm font-bold text-white whitespace-nowrap';
        el.style.background = 'var(--accent)';
        el.innerHTML = renderWordSpans();
      }

      areaEl.appendChild(el);
      currentTargetEl = el;
      targetShownAt = performance.now();
    }

    function handleAreaClick(e) {
      if (!roundActive) return;
      const hitEl = e.target.closest('[data-target]');
      if (hitEl && currentMode === 'click') {
        registerHit();
      } else if (!hitEl) {
        registerMiss();
      }
    }

    function handleKeydown(e) {
      if (!roundActive || currentMode !== 'type') return;
      if (e.repeat || e.key.length !== 1) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const expected = currentWord[typedBuffer.length];
      if (e.key.toUpperCase() === expected) {
        typedBuffer += expected;
        if (currentTargetEl) currentTargetEl.innerHTML = renderWordSpans();
        if (typedBuffer.length === currentWord.length) {
          registerHit();
        }
      } else {
        typedBuffer = '';
        registerMiss();
        if (currentTargetEl) currentTargetEl.innerHTML = renderWordSpans();
      }
    }

    function registerHit() {
      hitTimes.push(performance.now() - targetShownAt);
      if (currentTargetEl) { currentTargetEl.remove(); currentTargetEl = null; }
      targetIndex++;
      renderProgress();
      if (targetIndex >= TARGET_COUNT) finishRound();
      else spawnTarget();
    }

    function registerMiss() {
      misses++;
      renderProgress();
    }

    function finishRound() {
      roundActive = false;
      const totalMs = performance.now() - roundStartedAt;
      const avgMs = hitTimes.reduce((a, b) => a + b, 0) / hitTimes.length;
      const accuracyPct = Math.round((TARGET_COUNT / (TARGET_COUNT + misses)) * 100);
      const attempt = { accuracyPct, avgMs: Math.round(avgMs), totalMs: Math.round(totalMs), ts: Date.now() };
      recordAttempt(attempt);
      renderResult(attempt);
      renderStats();
    }

    function recordAttempt(attempt) {
      stats.attempts.unshift(attempt);
      stats.attempts = stats.attempts.slice(0, 20);
      if (!stats.best || attempt.avgMs < stats.best.avgMs) {
        stats.best = attempt;
      }
      Storage.save('aim', stats);
    }

    function renderResult(attempt) {
      overlayEl = document.createElement('div');
      overlayEl.className = 'absolute inset-0 flex flex-col items-center justify-center gap-2 text-center px-6';
      overlayEl.style.background = 'color-mix(in oklab, var(--bg) 88%, transparent)';
      overlayEl.innerHTML = `
        <div class="font-display font-bold text-2xl">${attempt.accuracyPct}% accuracy</div>
        <div class="text-sm text-[var(--muted)]">${formatMs(attempt.avgMs)} avg &middot; ${formatMs(attempt.totalMs)} total</div>
        <button type="button" class="mt-2 font-display font-bold text-lg px-6 py-3 rounded-xl text-white" style="background:var(--accent-2)">Hunt again</button>
      `;
      overlayEl.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); startRound(); });
      areaEl.appendChild(overlayEl);
    }

    function renderProgress() {
      const el = root.querySelector('#aim-progress');
      if (!roundActive && targetIndex === 0) { el.textContent = ''; return; }
      el.textContent = `${targetIndex}/${TARGET_COUNT} · ${misses} miss${misses === 1 ? '' : 'es'}`;
    }

    function renderStats() {
      root.querySelector('#aim-best').textContent = stats.best ? `${formatMs(stats.best.avgMs)} (${stats.best.accuracyPct}%)` : '—';

      const historyEl = root.querySelector('#aim-history');
      if (!stats.attempts.length) {
        historyEl.innerHTML = `<div class="text-[var(--muted)]">No hunts yet.</div>`;
        return;
      }
      historyEl.innerHTML = stats.attempts.map(a => `
        <div class="flex items-center justify-between">
          <span class="text-[var(--muted)]">${a.accuracyPct}% accuracy</span>
          <span class="font-mono font-semibold">${formatMs(a.avgMs)} avg</span>
        </div>
      `).join('');
    }

    ToolRegistry.register({
      id: 'aim',
      name: 'Aim Tester',
      color: 'var(--accent-2)',
      icon: ICON,
      tagline: 'Line up your shot. Click 20 targets to take the Hair Monster down.',
      mount,
      unmount,
    });
  })();

  // ===== Bootstrap =====
  buildSidebarNav();
  window.addEventListener('hashchange', renderRoute);
  renderRoute();
</script>

</body>
</html>
